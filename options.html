<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>gi-log settings</title>
  <style>
    body {
      max-width: 480px;
      margin: 40px auto;
      font-family: sans-serif;
      font-size: 14px;
      background: #212121;
      color: #ececec;
    }
    h2 { color: #10a37f; margin-bottom: 24px; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #2f2f2f;
      border: 1px solid #444;
      border-radius: 6px;
      color: #ececec;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      margin-bottom: 16px;
    }
    input:focus { border-color: #10a37f; }
    button {
      padding: 10px 24px;
      background: #10a37f;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #0e8f6e; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #10a37f;
      min-height: 18px;
    }
    .hint {
      font-size: 11px;
      color: #555;
      margin-top: -12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <h2>gi-log settings</h2>

  <label>API Token</label>
  <input type="password" id="token-input" placeholder="gilg_..." />
  <p class="hint">Get your token from your gi-log admin.</p>

  <label>API URL</label>
  <input type="text" id="url-input" placeholder="https://gi-log-api-production.up.railway.app" />
  <p class="hint">Leave as default unless using a custom deployment.</p>

  <button id="save-btn">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
